plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jlleitschuh.gradle.ktlint'
}

def signingProperties = new Properties()
def gitCommit = "git rev-parse --short HEAD".execute([], project.rootDir).text.trim()
if (!gitCommit) {
    gitCommit = "unknown"
}
def signingPropertiesFile = file(
    System.getenv('PANTRYCRAFT_SIGNING_PROPERTIES') ?: "${System.getProperty('user.home')}/.config/pantrycraft/signing.properties",
)
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.jeffers.pantrycraft'
    compileSdk 36

    defaultConfig {
        applicationId "com.jeffers.pantrycraft"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    kapt {
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas")
            arg("room.incremental", "true")
        }
    }

    signingConfigs {
        release {
            if (!signingProperties.isEmpty()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            testCoverageEnabled true
            versionNameSuffix "-${gitCommit}"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}


dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.compose.ui:ui:1.5.2'
    implementation 'androidx.compose.material3:material3:1.2.0'
    implementation 'androidx.compose.material:material-icons-extended:1.5.2'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.5.2'
    implementation 'androidx.navigation:navigation-compose:2.7.5'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.mlkit:object-detection:17.0.2'
    implementation 'androidx.room:room-ktx:2.8.5'
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'net.zetetic:sqlcipher-android:4.19.1'
    kapt 'androidx.room:room-compiler:2.8.5'

    // Optional - lifecycle and coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Navigation and ViewModel compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.room:room-testing:2.8.5'
    androidTestImplementation 'net.zetetic:sqlcipher-android:4.19.1'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.5.2'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.5.2'
}
