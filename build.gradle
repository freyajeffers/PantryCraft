buildscript {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.85'
            force 'org.bouncycastle:bcpkix-jdk18on:1.85'
            force 'org.jdom:jdom2:2.0.6.1'
            force 'org.bitbucket.b_c:jose4j:0.9.6'
            force 'io.netty:netty-codec-http:4.2.19.Final'
            force 'io.netty:netty-codec-http2:4.2.19.Final'
            force 'io.netty:netty-handler:4.2.19.Final'
            force 'io.netty:netty-common:4.2.19.Final'
            force 'io.netty:netty-codec:4.2.19.Final'
            force 'io.netty:netty-buffer:4.2.19.Final'
            force 'io.netty:netty-transport:4.2.19.Final'
            force 'io.netty:netty-handler-proxy:4.2.19.Final'
            force 'io.netty:netty-codec-socks:4.2.19.Final'
            force 'ch.qos.logback:logback-core:1.6.6'
            force 'ch.qos.logback:logback-classic:1.6.6'
            force 'org.apache.commons:commons-lang3:3.21.0'
            force 'org.apache.httpcomponents:httpclient:4.5.14'
            force 'com.google.guava:guava:33.4.0-jre'
        }
    }
}

plugins {
    id 'com.android.application' version '9.5.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.2.10' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10' apply false
    id 'org.jlleitschuh.gradle.ktlint' version '14.2.0' apply false
    id 'io.gitlab.arturbosch.detekt' version '1.23.8' apply false
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.85'
            force 'org.bouncycastle:bcpkix-jdk18on:1.85'
            force 'org.jdom:jdom2:2.0.6.1'
            force 'org.bitbucket.b_c:jose4j:0.9.6'
            force 'io.netty:netty-codec-http:4.2.19.Final'
            force 'io.netty:netty-codec-http2:4.2.19.Final'
            force 'io.netty:netty-handler:4.2.19.Final'
            force 'io.netty:netty-common:4.2.19.Final'
            force 'io.netty:netty-codec:4.2.19.Final'
            force 'io.netty:netty-buffer:4.2.19.Final'
            force 'io.netty:netty-transport:4.2.19.Final'
            force 'io.netty:netty-handler-proxy:4.2.19.Final'
            force 'io.netty:netty-codec-socks:4.2.19.Final'
            force 'ch.qos.logback:logback-core:1.6.6'
            force 'ch.qos.logback:logback-classic:1.6.6'
            force 'com.squareup.okhttp3:okhttp:4.12.0'
            force 'com.squareup.okio:okio:3.9.1'
            force 'org.apache.commons:commons-lang3:3.21.0'
            force 'org.apache.httpcomponents:httpclient:4.5.14'
            force 'com.google.guava:guava:33.4.0-android'
        }
    }
}
