# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MobSF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '41 3 * * 3'

permissions:
  contents: read

jobs:
  mobile-security:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.15

      - name: Install mobsfscan
        run: python -m pip install --disable-pip-version-check mobsfscan==1.0.1

      - name: Run MobSF source scan
        run: >-
          mobsfscan app/src/main
          --type android
          --sarif
          --exit-warning
          --config app/.mobsf
          --output results.sarif

      - name: Upload MobSF SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: results.sarif

      - name: Preserve MobSF report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mobsfscan-source-report
          path: results.sarif
          if-no-files-found: error
